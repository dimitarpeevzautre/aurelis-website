name: Deploy to GitHub Pages

# Pages is configured to serve from the gh-pages branch ("deploy from
# branch"). This workflow mirrors the source branch to gh-pages on every
# push; GitHub's pages-build-deployment then publishes it. The
# actions/deploy-pages approach isn't usable here: the github-pages
# environment's branch policy only allows gh-pages, and changing that
# (or the Pages source) requires repo-admin permissions.

on:
  push:
    branches:
      - claude/vw-california-camper-site-151wk2
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mirror to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
